{% extends "base.html" %}
{% block content %}
<h2>{% if process %}Prozess bearbeiten{% else %}Prozess erstellen{% endif %}</h2>

<form method="post" class="form-card">
    <label>Name
        <input name="name" value="{{ process.name if process else '' }}" required>
    </label>

    <label>Organisation
        <select name="organization_id" required>
            {% set _sel_org = (process.organization_id if process and process.organization_id else active_organization_id) %}
            <option value="">— bitte wählen —</option>
            {% for org in organizations %}
                <option value="{{ org.id }}" {% if _sel_org == org.id %}selected{% endif %}>{{ org.name }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Process Owner / verantwortliche Organisationseinheit
        <select name="owner_org_unit_id">
            <option value="">kein Process Owner</option>
            {% for unit in owner_units %}
                <option value="{{ unit.id }}" {% if process and process.owner_org_unit_id == unit.id %}selected{% endif %}>
                    {{ unit.organization.name }} – {{ unit.name }} ({{ unit.unit_type }})
                </option>
            {% endfor %}
        </select>
    </label>

    <label>Priorität
        <select name="priority">
            {% set _prio = process.priority if process and process.priority else 2 %}
            <option value="1" {% if _prio == 1 %}selected{% endif %}>Hoch</option>
            <option value="2" {% if _prio == 2 %}selected{% endif %}>Mittel</option>
            <option value="3" {% if _prio == 3 %}selected{% endif %}>Niedrig</option>
        </select>
    </label>

    <label>Prozesstyp (für die Prozesslandkarte, optional)
        <input name="process_type" list="process-type-suggestions"
               value="{{ process.process_type if process and process.process_type else '' }}"
               placeholder="z. B. Kernprozess, Führungsprozess, Unterstützungsprozess">
        <datalist id="process-type-suggestions">
            <option value="Führungsprozess">
            <option value="Kernprozess">
            <option value="Unterstützungsprozess">
        </datalist>
    </label>

    <label>In Prozesslandkarte eingebunden in
        <select name="parent_process_id">
            <option value="">kein übergeordneter Prozess / Hauptprozess</option>
            {% for p in processes %}
                {% if not process or p.id != process.id %}
                    <option value="{{ p.id }}"
                        {% if (process and process.parent_process_id == p.id) or (parent and parent.id == p.id) %}selected{% endif %}>
                        {{ p.name }}
                    </option>
                {% endif %}
            {% endfor %}
        </select>
    </label>

    <button type="submit">Speichern</button>
</form>

{% if process %}
    <p>
        <a class="button" href="{{ url_for('process.bpmn_editor', process_id=process.id) }}">BPMN-Modell öffnen</a>
        <a class="button" href="{{ url_for('process.process_map') }}">Zur Prozesslandkarte</a>
    </p>
{% endif %}
{% endblock %}
