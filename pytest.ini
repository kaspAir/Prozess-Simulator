[pytest]
# Projekt-Root auf den Import-Pfad legen, damit "import app" auch funktioniert,
# wenn pytest direkt (nicht via "python -m pytest") aufgerufen wird – z. B. in CI.
pythonpath = .
testpaths = tests
markers =
    teststufe: Fachliche Testfaelle (TC-Katalog), die erst ab Umgebung test laufen – nicht auf dev.
